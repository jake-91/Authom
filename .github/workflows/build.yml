name: macOS bundle

# A dmg can only be produced on macOS — Apple ships its SDK and frameworks for
# that platform alone, so Tauri has no cross-compilation path from Windows.
#
# Runs on demand and on release tags only. Building on every push to main would
# burn several minutes of runner time for a bundle nobody asked for.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  dmg:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # `universal-apple-darwin` is a Tauri construct, not a rustup target.
          # Tauri builds these two and lipo's them into one binary, so both
          # have to be installed here.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build dmg
        run: npm run tauri build -- --target universal-apple-darwin --bundles dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          # Fail loudly rather than upload an empty artifact if the path drifts.
          if-no-files-found: error
