[package]
name = "authom"
version = "0.1.0"
description = "Local-first TOTP/HOTP authenticator"
edition = "2021"
rust-version = "1.82"

[lib]
name = "authom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
argon2 = "0.5.3"
base64 = "0.23.1"
chacha20poly1305 = "0.10.1"
getrandom = "0.3.4"
hmac = "0.12.1"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }
percent-encoding = "2.3.2"
rqrr = "0.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10.7"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
thiserror = "2.0.20"
url = "2.5.8"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
xcap = "0.9.8"
zeroize = { version = "1.8.2", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
